<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#080c15" />
  <title>Get Key Free Fire iPA - Key Của Bạn</title>
  <style>
    :root {
      --bg: #070b14;
      --panel: rgba(15, 22, 39, 0.82);
      --border: rgba(255, 255, 255, 0.10);
      --text: #f8fafc;
      --muted: #a9b4c9;
      --primary: #7c5cff;
      --primary-2: #34d7ff;
      --success: #45e5a2;
      --warning: #ffd166;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 20px;
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 20% 10%, rgba(124, 92, 255, 0.22), transparent 34%),
        radial-gradient(circle at 85% 90%, rgba(52, 215, 255, 0.15), transparent 32%),
        var(--bg);
    }

    .card {
      width: min(620px, 100%);
      padding: clamp(26px, 5vw, 48px);
      border: 1px solid var(--border);
      border-radius: 28px;
      background: var(--panel);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: 0 30px 90px rgba(0, 0, 0, 0.45);
      text-align: center;
    }

    .success-icon {
      width: 76px;
      height: 76px;
      margin: 0 auto 22px;
      display: grid;
      place-items: center;
      border-radius: 24px;
      font-size: 34px;
      background: linear-gradient(135deg, rgba(69, 229, 162, 0.26), rgba(52, 215, 255, 0.16));
      border: 1px solid rgba(69, 229, 162, 0.28);
      box-shadow: 0 14px 40px rgba(69, 229, 162, 0.14);
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      color: #bff8df;
      background: rgba(69, 229, 162, 0.08);
      border: 1px solid rgba(69, 229, 162, 0.19);
      font-size: 13px;
      font-weight: 800;
    }

    h1 {
      margin: 18px 0 10px;
      font-size: clamp(32px, 7vw, 48px);
      letter-spacing: -0.045em;
    }

    .subtitle {
      margin: 0 auto;
      max-width: 500px;
      color: var(--muted);
      line-height: 1.7;
    }

    .key-box {
      margin: 28px 0 14px;
      padding: 18px;
      border-radius: 18px;
      border: 1px dashed rgba(124, 92, 255, 0.48);
      background: rgba(124, 92, 255, 0.08);
      overflow-wrap: anywhere;
    }

    .key-label {
      display: block;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .key-value {
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      font-size: clamp(20px, 5vw, 29px);
      font-weight: 900;
      letter-spacing: 0.05em;
      color: #ffffff;
    }

    .meta {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }

    .meta-item {
      padding: 9px 12px;
      border-radius: 12px;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.045);
      border: 1px solid rgba(255, 255, 255, 0.07);
      font-size: 13px;
    }

    .meta-item strong {
      color: var(--warning);
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .btn {
      min-height: 52px;
      padding: 0 18px;
      border-radius: 15px;
      border: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      color: white;
      font: inherit;
      font-weight: 850;
      text-decoration: none;
      cursor: pointer;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary), #5d8cff 56%, var(--primary-2));
      box-shadow: 0 14px 30px rgba(93, 109, 255, 0.28);
    }

    .btn-secondary {
      border: 1px solid rgba(255, 255, 255, 0.10);
      background: rgba(255, 255, 255, 0.055);
    }

    .small-note {
      margin: 22px 0 0;
      color: #7f8ba2;
      font-size: 12px;
      line-height: 1.6;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translate(-50%, 100px);
      padding: 12px 16px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 13px;
      background: rgba(12, 18, 31, 0.97);
      color: white;
      opacity: 0;
      transition: 0.3s ease;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.42);
    }

    .toast.show {
      transform: translate(-50%, 0);
      opacity: 1;
    }

    @media (max-width: 520px) {
      .card {
        border-radius: 22px;
        padding: 24px 18px;
      }

      .actions {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="success-icon">✓</div>

    <div class="status">● Vượt Link Thành Công</div>

    <h1>Key Của Bạn</h1>

    <p class="subtitle">
      Sao Chép Key Bên Dưới Và Nhập Vào Ứng Dụng Hoặc Bot. Tải Lại Trang
      Vẫn Hiển Thị Đúng Key Cũ Của Phiên Này.
    </p>

    <section class="key-box">
      <span class="key-label">Mã Kích Hoạt</span>
      <div class="key-value" id="keyValue">Đang Tạo Key...</div>
    </section>

    <div class="meta">
      <div class="meta-item">Trạng Thái: <strong>Còn Hiệu Lực</strong></div>
    </div>

    <div class="actions">
      <button class="btn btn-primary" id="copyButton" type="button">
        📋 Sao Chép Key
      </button>

      <a class="btn btn-secondary" href="index.html">
        ← Quay Lại
      </a>
    </div>

    <p class="small-note">
      Muốn Nhận Key Mới, Bạn Phải Quay Lại Trang Chính Và Vượt Link
      Lại Từ Đầu.
    </p>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>


  <script>
    (function () {
      if (!window.crypto || typeof window.crypto.randomUUID === "function") {
        return;
      }

      function fallbackUuidV4() {
        const bytes = new Uint8Array(16);
        window.crypto.getRandomValues(bytes);

        bytes[6] = (bytes[6] & 15) | 64;
        bytes[8] = (bytes[8] & 63) | 128;

        const hex = Array.from(bytes, function (value) {
          return value.toString(16).padStart(2, "0");
        });

        return [
          hex.slice(0, 4).join(""),
          hex.slice(4, 6).join(""),
          hex.slice(6, 8).join(""),
          hex.slice(8, 10).join(""),
          hex.slice(10, 16).join("")
        ].join("-");
      }

      try {
        Object.defineProperty(window.crypto, "randomUUID", {
          configurable: true,
          value: fallbackUuidV4
        });
      } catch {
        window.crypto.randomUUID = fallbackUuidV4;
      }
    })();
  </script>

  <script src="config.js"></script>

  <script>
    const config = window.APP_CONFIG || {};
    const keyValue = document.getElementById("keyValue");
    const copyButton = document.getElementById("copyButton");
    const toast = document.getElementById("toast");
    const statusText = document.querySelector(".meta-item strong");

    const SESSION_STORAGE_KEY =
      config.SESSION_STORAGE_KEY || "migul_key_session_token_v1";
    const KEY_CACHE_STORAGE_KEY =
      config.KEY_CACHE_STORAGE_KEY || "migul_claimed_key_cache_v1";

    let currentKey = "";

    document.title =
      `${config.APP_NAME || "Get Key Free Fire iPA"} - Key Của Bạn`;

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");

      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => {
        toast.classList.remove("show");
      }, 2700);
    }

    function getFunctionUrl() {
      const baseUrl = String(config.SUPABASE_URL || "")
        .trim()
        .replace(/\/+$/, "");

      const functionName = String(config.EDGE_FUNCTION_NAME || "key-api")
        .trim()
        .replace(/^\/+|\/+$/g, "");

      if (
        !baseUrl ||
        baseUrl.includes("YOUR_PROJECT_ID") ||
        !/^https:\/\/.+\.supabase\.co$/i.test(baseUrl)
      ) {
        throw new Error("SUPABASE_NOT_CONFIGURED");
      }

      return `${baseUrl}/functions/v1/${functionName}`;
    }

    async function callKeyApi(action, payload = {}) {
      const response = await fetch(getFunctionUrl(), {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          Accept: "application/json"
        },
        body: JSON.stringify({
          action,
          ...payload
        }),
        cache: "no-store"
      });

      let data = {};

      try {
        data = await response.json();
      } catch {
        throw new Error("INVALID_SERVER_RESPONSE");
      }

      if (!response.ok || data.success !== true) {
        const error = new Error(data.error || `HTTP_${response.status}`);
        error.code = data.error || `HTTP_${response.status}`;
        throw error;
      }

      return data;
    }

    function readJsonStorage(storageKey) {
      try {
        const raw = localStorage.getItem(storageKey);
        return raw ? JSON.parse(raw) : null;
      } catch {
        return null;
      }
    }

    function saveSessionToken(token) {
      const oldSession = readJsonStorage(SESSION_STORAGE_KEY);

      if (oldSession?.token !== token) {
        localStorage.removeItem(KEY_CACHE_STORAGE_KEY);
      }

      localStorage.setItem(
        SESSION_STORAGE_KEY,
        JSON.stringify({
          token,
          createdAt: Date.now()
        })
      );
    }

    function acceptTokenFromUrl() {
      const params = new URLSearchParams(window.location.search);
      const token = String(params.get("token") || "").trim();

      if (!token) {
        return false;
      }

      // Token do Edge Function tạo là UUID.
      const uuidPattern =
        /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;

      if (!uuidPattern.test(token)) {
        return false;
      }

      saveSessionToken(token);

      // Xóa token khỏi thanh địa chỉ sau khi đã lưu.
      window.history.replaceState(
        {},
        document.title,
        window.location.pathname
      );

      return true;
    }

    function readSession() {
      const session = readJsonStorage(SESSION_STORAGE_KEY);

      if (!session?.token) {
        return null;
      }

      return session;
    }

    function readCachedKey() {
      const cached = readJsonStorage(KEY_CACHE_STORAGE_KEY);

      if (!cached?.key) {
        return null;
      }

      return cached;
    }

    function saveCachedKey(token, key) {
      localStorage.setItem(
        KEY_CACHE_STORAGE_KEY,
        JSON.stringify({
          token,
          key,
          savedAt: Date.now()
        })
      );
    }

    function renderKey(key, label = "Còn Hiệu Lực") {
      currentKey = key;
      keyValue.textContent = key;
      statusText.textContent = label;
      copyButton.disabled = false;
    }

    function redirectToStart() {
      window.location.replace("index.html?key_required=1");
    }

    async function loadKey() {
      const hasFreshToken = acceptTokenFromUrl();

      copyButton.disabled = true;
      keyValue.textContent = "Đang Kiểm Tra Phiên...";
      statusText.textContent = "Đang Kiểm Tra";

      const session = readSession();
      const cached = readCachedKey();

      if (!session) {
        if (cached?.key) {
          renderKey(cached.key, "Key Cũ");
          return;
        }

        redirectToStart();
        return;
      }

      if (cached?.token === session.token && cached?.key) {
        renderKey(cached.key);
      }

      try {
        const data = await callKeyApi("claim", {
          token: session.token
        });

        if (!data.key) {
          throw new Error("KEY_NOT_FOUND");
        }

        saveCachedKey(session.token, data.key);
        renderKey(data.key);
      } catch (error) {
        console.error(error);

        if (cached?.token === session.token && cached?.key) {
          renderKey(cached.key, "Key Cũ");
          showToast("Không Thể Kết Nối Máy Chủ. Đang Hiển Thị Key Đã Lưu.");
          return;
        }

        if (
          error.code === "INVALID_SESSION" ||
          error.code === "SESSION_EXPIRED"
        ) {
          localStorage.removeItem(SESSION_STORAGE_KEY);
          showToast("Phiên Đã Hết Hạn. Vui Lòng Vượt Link Lại.");
          setTimeout(redirectToStart, 1400);
          return;
        }

        if (error.code === "OUT_OF_KEYS") {
          keyValue.textContent = "Tạm Hết Key";
          statusText.textContent = "Hết Key";
          showToast("Kho Key Đã Hết. Vui Lòng Quay Lại Sau.");
          return;
        }

        if (error.message === "SUPABASE_NOT_CONFIGURED") {
          keyValue.textContent = "Chưa Cấu Hình Supabase";
          statusText.textContent = "Lỗi Cấu Hình";
          showToast("Bạn Chưa Điền SUPABASE_URL Trong config.js.");
          return;
        }

        // Vào thẳng key.html (không có token mới trên URL) mà claim hỏng:
        // đưa về trang chính để vượt link lại thay vì báo lỗi cụt.
        if (!hasFreshToken) {
          localStorage.removeItem(SESSION_STORAGE_KEY);
          showToast("Vui Lòng Vượt Link Từ Đầu Để Nhận Key.");
          setTimeout(redirectToStart, 1400);
          return;
        }

        const errorCode =
          String(error?.code || error?.message || "UNKNOWN");

        keyValue.textContent = "Không Thể Tải Key";
        statusText.textContent = "Lỗi: " + errorCode;
        showToast("Không Thể Tải Key. Mã Lỗi: " + errorCode);
      }
    }

    copyButton.addEventListener("click", async () => {
      if (!currentKey) {
        showToast("Chưa Có Key Để Sao Chép.");
        return;
      }

      try {
        await navigator.clipboard.writeText(currentKey);
        showToast("Đã Sao Chép Key.");
      } catch {
        const textarea = document.createElement("textarea");
        textarea.value = currentKey;
        textarea.style.position = "fixed";
        textarea.style.opacity = "0";

        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand("copy");
        textarea.remove();

        showToast("Đã Sao Chép Key.");
      }
    });

    loadKey();
  </script>

</body>
</html>
